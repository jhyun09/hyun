<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>회원가입</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Noto Sans KR', sans-serif;
      background-image: url('{{ url_for("static", filename="images/main1.jpg") }}');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      backdrop-filter: brightness(0.85);
      color: white;
    }

    .signup-box {
      background: rgba(0, 0, 0, 0.6);
      padding: 2rem 3rem;
      border-radius: 15px;
      text-align: center;
      width: 350px;
    }

    .signup-box h2 {
      margin-bottom: 1.5rem;
    }

    .signup-box form {
      display: flex;
      flex-direction: column;
    }

    .signup-box input[type="text"],
    .signup-box input[type="password"],
    .signup-box input[type="email"] {
      padding: 0.8rem;
      margin-bottom: 1rem;
      border: none;
      border-radius: 5px;
      font-size: 1rem;
    }

    .signup-box button {
      padding: 0.8rem;
      background: white;
      color: #333;
      border: none;
      border-radius: 5px;
      font-weight: bold;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .signup-box button:hover {
      background: #ddd;
    }

    .message {
      margin-top: 1rem;
      color: #ffcccb;
      font-size: 0.9rem;
    }

    .info-text {
      margin-top: 0.5rem;
      font-size: 0.85rem;
      color: #ccc;
    }

    .back-link {
      margin-top: 1.2rem;
      display: block;
      color: #bbb;
      text-decoration: none;
      font-size: 0.9rem;
    }

    .back-link:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="signup-box">
    <h2>📝 회원가입</h2>
    <form method="POST" action="{{ url_for('auth.signup') }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <input type="text" name="username" placeholder="사용자명 (닉네임 또는 아이디)" required>
      <input type="email" name="email" placeholder="이메일 주소" required>
      <input type="password" name="password" placeholder="비밀번호" required>
      <input type="password" name="confirm" placeholder="비밀번호 확인" required>
      <button type="submit">가입하기</button>
    </form>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="message">{{ message }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <p class="info-text">
      가입 후 관리자의 승인을 거쳐야 로그인할 수 있습니다.
    </p>

    <a class="back-link" href="{{ url_for('auth.login') }}">이미 가입하셨나요? 로그인하기 →</a>
  </div>
</body>
</html>
